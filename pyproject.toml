[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-housesitter"
version = "0.1.0.dev0"
description = "Read-only data gathering for Muse on a Raspberry Pi."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jon Schwenn" }]
requires-python = ">=3.9"
# Runtime is stdlib only (AGENTS.md rule 4). Adding a dependency needs a DECISIONS entry.
dependencies = []

[project.optional-dependencies]
# setuptools and wheel let the packaging test build the wheel offline
# (--no-build-isolation), so the default test run needs no network.
dev = ["pytest==8.4.2", "ruff==0.17.4", "setuptools==80.9.0", "wheel==0.45.1"]
# Dev/CI-only screenshot tooling for scripts/ui_evidence.py. Never a runtime
# dependency (AGENTS.md rule 4): nothing under src/ may import it.
ui = ["playwright==1.60.0"]

[project.scripts]
housesitter = "housesitter.core.cli:main"

[tool.setuptools.package-dir]
"" = "src"
"housesitter.web" = "web"

[tool.setuptools]
packages = [
  "housesitter",
  "housesitter.core",
  "housesitter.modules",
  "housesitter.modules.unifi_wifi",
  "housesitter.web",
]

[tool.setuptools.package-data]
"housesitter.web" = ["*.html", "*.css", "*.js", "*.svg", "*.png", "*.ico"]
"housesitter.modules.unifi_wifi" = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
