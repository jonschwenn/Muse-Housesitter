# The only CI workflow (docs/DECISIONS.md D12). The `main` ruleset requires `ci-ok`.
#
# Security notes:
# - Actions are GitHub's own, pinned to full commit SHAs (tag in the comment).
# - The default token is read-only. Only `evidence-comment` can write, and it
#   never checks out or runs PR code. It does post text that the PR's own code
#   produced (in `evidence`), so a PR author controls that comment's content.
#   It checks the marker and size, and edits only its own bot comment.
# - Checkouts don't persist credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]   # the SDK's floor, and the newest release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Check out the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git -C head worktree add "$GITHUB_WORKSPACE/base" "$BASE_SHA"
      - name: Build the evidence comment
        run: >
          python head/scripts/pr_evidence.py
          --base-tree base --head-tree head --out evidence.md
      - name: Show it in the job summary
        run: cat evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: evidence.md
          retention-days: 30

  evidence-comment:
    needs: evidence
    # A fork's token can't comment; its evidence is still in the job summary.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
      - name: Post or update the evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- housesitter-evidence -->'
          if [ "$(head -c ${#marker} evidence.md)" != "$marker" ]; then
            echo "evidence.md does not start with the marker; not posting"; exit 1
          fi
          if [ "$(wc -c < evidence.md)" -gt 65000 ]; then
            echo "evidence.md is too large for a comment; not posting"; exit 1
          fi
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@evidence.md > /dev/null
            echo "Updated comment $id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@evidence.md > /dev/null
            echo "Posted a new comment"
          fi

  ci-ok:
    # The one check the ruleset requires. Passes only if every job above
    # succeeded or was skipped on purpose (evidence jobs are skipped on push).
    if: always()
    needs: [test, evidence, evidence-comment]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required job ended with: $r"; exit 1 ;;
            esac
          done
