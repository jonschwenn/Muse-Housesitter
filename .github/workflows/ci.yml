# CI: lint, test, and evidence (docs/DECISIONS.md D12, D16). The `main`
# ruleset requires `ci-ok` and `ci-guard` (applied 2026-11-07;
# docs/GITHUB.md step 3).
#
# Trust model (read this before changing this file):
# - Actions are GitHub's own, pinned to full commit SHAs (tag in the comment).
# - This workflow runs on `pull_request`, so for same-repo PRs the workflow
#   file itself comes from the PR. A PR that edits `ci.yml` controls this
#   file's jobs too. The guarantees below hold only for the workflow as it
#   exists on `main`, so review any `ci.yml` change line by line — and the
#   `ci-guard` check blocks untrusted edits to it from merging (D16).
# - This workflow never pushes, never comments, and never runs with a write
#   token: every job has `permissions: contents: read` only. Posting the
#   evidence comment and pushing screenshots is the job of
#   `.github/workflows/evidence-publish.yml`, which runs on `workflow_run`
#   from `main`'s code, not the PR's. A malicious `ci.yml` can therefore
#   break or fake the evidence in its own run, but it cannot get a green
#   `ci-ok`/`ci-guard` pair onto `main` through the guard, and it cannot
#   publish a fake comment: the publisher validates the artifact with
#   `main`'s validator before it pushes or posts anything.
# - The evidence job runs PR code (the capture and the comment builders)
#   with a read-only token. UI check failures fail this workflow: a console
#   error or warning, a page error, a CSP or Trusted Types violation, a
#   dialog, overflow, clipping, a wrong-size e-ink shot, or a page taller
#   than the height cap. See docs/REVIEW.md, "Evidence".
# - Checkouts don't persist credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SDK's floor. actions/setup-python has no 3.9 build for Ubuntu
          # 26.04 (ubuntu-latest since 2026-10), so this one stays on 24.04.
          - python: "3.9"
            os: ubuntu-24.04
          # The newest release.
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          # No third-party pytest plugin is installed or needed; disabling
          # entry-point autoload closes the plugin-weakening vector (D16).
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest --junitxml=junit.xml -o junit_suite_name=python-${{ steps.setup-python.outputs.python-version }}
      - name: Test results summary
        # Never fails the job: a bad file prints a one-line notice and the
        # step exits 0, so the summary still appears when tests fail.
        if: always()
        run: python scripts/test_results.py summary --junit junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Protected suites, in isolation
        if: always()
        # The full run above imports every test module in one process, so a
        # new (unprotected) test file could patch a protected suite at import
        # time. Re-run the protected suites alone: no other test module is
        # ever imported here (conftest.py and pytest config are protected
        # paths), so what they check cannot be switched off from outside
        # them (D16).
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          suites=()
          for path in tests/test_hygiene.py tests/conformance \
                      tests/test_pr_evidence.py tests/test_ui_evidence.py \
                      tests/test_publish_evidence.py tests/test_ci_guard.py \
                      tests/test_test_results.py; do
            if [ -e "$path" ]; then suites+=("$path"); fi
          done
          test -e tests/test_hygiene.py
          pytest -p no:cacheprovider "${suites[@]}"

  evidence:
    # Runs PR code (the capture and the comment builders) with a read-only
    # token. It never pushes or comments; evidence-publish.yml does that
    # from main's code after this workflow completes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Check out the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git -C head worktree add "$GITHUB_WORKSPACE/base" "$BASE_SHA"
      # Screenshots use the Google Chrome that GitHub's runner image ships
      # (updated weekly, like real users' Chrome), not a Playwright-bundled
      # browser, so the job doesn't depend on Playwright supporting the
      # runner's Ubuntu release. Base and head are captured in this one job
      # with the same Chrome, so the before/after comparison stays fair.
      - name: Install the UI capture dependencies
        run: |
          python -m pip install -e "./head[ui]"
          google-chrome --version
      - name: Capture the web UI
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ui_exit=0
          python head/scripts/ui_evidence.py \
            --base-tree base --head-tree head --out-dir ui_out \
            --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" \
            --browser-channel chrome || ui_exit=$?
          echo "UI_EXIT=$ui_exit" >> "$GITHUB_ENV"
      # Text only: the privileged publisher (evidence-publish.yml, running
      # from main) rebuilds the Web UI section from the validated manifest
      # with main's renderer, so PR-built markup never reaches the comment.
      - name: Build the evidence comment
        run: >
          python head/scripts/pr_evidence.py
          --base-tree base --head-tree head --out evidence.md
      - name: Show it in the job summary
        run: cat evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: |
            evidence.md
            ui_out/*.png
            ui_out/ui_manifest.json
          retention-days: 30
          if-no-files-found: warn
      - name: Fail on UI check failures
        if: env.UI_EXIT != '0'
        run: |
          echo "UI checks failed; see the ui_evidence output above"; exit 1

  ci-ok:
    # One of the two checks the ruleset requires. Passes only if every job
    # above succeeded or was skipped on purpose (evidence is skipped on push).
    if: always()
    needs: [test, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required job ended with: $r"; exit 1 ;;
            esac
          done
