# Privileged evidence publisher (docs/DECISIONS.md D16).
#
# Runs on `workflow_run`, which always uses this file from the default
# branch — never PR code. The unprivileged `CI` workflow builds the evidence
# with a read-only token and uploads it as an artifact; this workflow
# validates that artifact with main's code, pushes the screenshots to the
# orphan `pr-evidence` branch, and posts (or edits) the single bot comment.
#
# Trust model:
# - The artifact is fully untrusted. A fork PR can rewrite `ci.yml`, and a
#   same-repo PR controls its own `ci.yml` run, so the artifact may be
#   anything. Nothing from it is executed or sourced: `render` validates
#   the structured results (strict schema against main's scenario list)
#   and rebuilds the text section from them with main's `pr_evidence`
#   renderer (PR text appears only inside fenced code blocks, never as
#   prose), validates every PNG and the manifest with main's
#   `ui_evidence.validate_artifact` (names, PNG structure, size and count
#   caps, no symlinks or subdirectories), ignores any pre-rendered markdown,
#   and rebuilds the Web UI section from the validated manifest (which
#   escapes hostile values). The PR's markdown (evidence.md) is never read.
# - A refusal is never silent: `render` records a fixed reason code and the
#   `comment` job posts main's fixed notice (reason code only, no PR
#   content) instead of the comment. PR-derived values never reach a shell
#   command line: the reason travels in a file and is validated in Python.
# - The PR number never comes from the artifact. `resolve` looks it up
#   through the API from trusted event data (`head_branch` and the head
#   repository owner), keeps only runs of the real CI workflow file
#   (`workflow_run.path` pins the file; the `on:` name filter alone would
#   also match a same-named workflow a PR adds), and verifies the API's
#   current head SHA still matches the run's head SHA (a stale run whose PR
#   has moved on publishes nothing).
# - Least privilege per job: `resolve` reads PRs, `build` reads code and
#   artifacts, `push` is the only job that can write the repo, and `comment`
#   is the only job that can write PR comments. No caches anywhere here.
# - Every third-party step is GitHub's own, pinned to a full commit SHA.
name: evidence-publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# Deliberately no workflow-level concurrency group here (review round 1,
# findings 7-8, Claude's design decision): GitHub keeps one pending run per
# group and a newer arrival displaces it by queue order, not commit
# freshness, so a late stale run could displace the current head's pending
# publisher and then write nothing, losing the current evidence. The
# owner-plus-branch key is ambiguous too (alice/bob-fix and alice-bob/fix
# collide, and group names are case-insensitive), so unrelated PRs could
# displace each other. Instead, every write below re-checks freshness
# first: a stale run never writes, two runs for the same head write the
# same content, and a run for a newer head necessarily starts after that
# push, so it writes last. The pr-evidence push keeps its fetch-and-retry
# for concurrent pushes to the branch; no other concurrency control exists.

jobs:
  resolve:
    # PR runs only; push runs to main have no PR to comment on.
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      found: ${{ steps.lookup.outputs.found }}
      pr: ${{ steps.lookup.outputs.pr }}
      head_sha: ${{ steps.lookup.outputs.head_sha }}
    steps:
      - name: Find the PR for this run
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        run: |
          set -euo pipefail
          found=false
          pr=""
          if [ "$EVENT" != "pull_request" ]; then
            echo "workflow_run event is $EVENT, not pull_request; nothing to publish"
          elif [ "$WORKFLOW_PATH" != ".github/workflows/ci.yml" ]; then
            echo "workflow_run is for $WORKFLOW_PATH, not the CI workflow; ignoring"
          elif [ "$CONCLUSION" != "success" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "CI conclusion is $CONCLUSION; no evidence to publish"
          elif ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "bad head SHA in the event; ignoring"
          else
            echo "looking up open PRs for $HEAD_OWNER:$HEAD_BRANCH"
            # --method GET: with -f fields, gh api would otherwise send a POST
            # (create a PR), which this read-only token refuses.
            matches=$(gh api --method GET "repos/$REPO/pulls" \
              -f "head=$HEAD_OWNER:$HEAD_BRANCH" -f state=open \
              --jq "[.[] | select(.head.sha == \"$HEAD_SHA\") | .number]")
            count=$(echo "$matches" | jq 'length')
            if [ "$count" = "1" ]; then
              pr=$(echo "$matches" | jq -r '.[0]')
              found=true
              echo "publishing evidence for PR #$pr at $HEAD_SHA"
            else
              echo "found $count open PRs for that head; need exactly one (stale or ambiguous run)"
            fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build:
    # Download the untrusted artifact, validate it with main's code, and
    # render the final comment (still carrying the push-SHA placeholder),
    # or record the refusal reason when the artifact is invalid.
    needs: resolve
    if: needs.resolve.outputs.found == 'true'
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # A missing artifact is a refusal ("missing"), not a silent skip:
      # the render below records the reason and the comment job posts the
      # fixed notice, so every refusal still reaches the PR.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true
      # Test-result XML is PR-produced data, validated below with main's
      # code; a missing or bad file degrades only the Tests line (D21,
      # option A), never the whole publish.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true
      # The pass/fail headline comes from the jobs API, never the XML (D21).
      # Pass the run through env, never inline ${{ }} in run:. If the call
      # fails, the render still publishes with a degraded Tests line.
      - name: Fetch test job conclusions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" > jobs.json; then
            echo "fetched job conclusions"
          else
            echo "could not fetch job conclusions; continuing without them"
            rm -f jobs.json
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Validate and render
        env:
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python scripts/publish_evidence.py render \
            --artifact-dir artifact --out-dir rendered \
            --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --test-results-dir test-results --jobs-json jobs.json
      # Always upload: on refusal the render step fails after writing
      # refusal.json, and the comment job below needs that file to post
      # the fixed notice. (Render always writes comment.md plus the pushable
      # files, or refusal.json, before it exits.)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validated-evidence
          path: rendered
          retention-days: 30
          if-no-files-found: error

  push:
    # The only job with write access to the repo. Pushes only files main's
    # validator already allow-listed; skips the commit and push entirely when
    # the run brought no PNGs.
    needs: [resolve, build]
    name: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      evidence_sha: ${{ steps.push.outputs.evidence_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-evidence
          path: rendered
      # Main's check-head script for the freshness re-checks below. This
      # checks out trusted main code only (never PR code); the push itself
      # still happens in a fresh git directory holding just the files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: main
      - name: Push validated PNGs to pr-evidence
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          CHECK_PY: ${{ github.workspace }}/main/scripts/publish_evidence.py
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "bad PR number: $PR"; exit 1;; esac
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "bad head SHA: $HEAD_SHA"; exit 1
          fi
          # Freshness, re-checked immediately before every push below: the
          # PR may have moved during the fetch, so a check made earlier is
          # stale by push time. check-head exit 1 means "moved": stop
          # without writing and let the newer run publish instead.
          require_fresh_head() {
            rc=0
            python3 "$CHECK_PY" check-head \
              --repo "$REPO" --pr "$PR" --expected "$HEAD_SHA" || rc=$?
            if [ "$rc" = 1 ]; then exit 0; fi
            if [ "$rc" != 0 ]; then exit "$rc"; fi
          }
          # No checkout of any code happens here: a fresh git directory that
          # only ever contains the validated files main's renderer selected.
          rm -rf push && mkdir push && cd push
          git init -q -b tmp
          git remote add origin "https://github.com/${REPO}.git"
          # Authenticate without putting the token in the remote URL: git
          # sends this header on every request instead.
          # GitHub's git server takes Basic auth with the x-access-token
          # user (as actions/checkout sends it), not a Bearer header. The
          # encoded value is a new string the runner doesn't know is secret,
          # so mask it before anything could print it.
          basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic_auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.extraHeader"
          export GIT_CONFIG_VALUE_0="Authorization: Basic ${basic_auth}"
          # Shallow: only the branch tip is needed, not every earlier PR's PNGs.
          # Tell "no pr-evidence branch yet" (ls-remote exit 2) apart from
          # "can't reach or log in to GitHub" (anything else), so an auth
          # failure stops here with a clear message instead of being hidden.
          set +e
          git ls-remote --exit-code --heads origin pr-evidence > /dev/null
          remote_rc=$?
          set -e
          case "$remote_rc" in
            0) git fetch --depth 1 origin pr-evidence
               git checkout -q -b pr-evidence FETCH_HEAD ;;
            2) echo "no pr-evidence branch yet; starting it"
               git checkout -q --orphan pr-evidence ;;
            *) echo "cannot reach the repository (git ls-remote exit $remote_rc)"
               exit 1 ;;
          esac
          dest="pr/${PR}/${HEAD_SHA}"
          shopt -s nullglob
          pngs=(../rendered/files/*.png)
          if (( ${#pngs[@]} == 0 )); then
            # No PNGs to pin: every capture was unchanged, or neither side
            # has a web UI. Commit and push nothing; the comment below has no
            # images and needs no evidence SHA.
            echo "no PNGs to push for this head SHA"
            EVIDENCE_SHA="$HEAD_SHA"
          else
            mkdir -p "$dest"
            for shot in "${pngs[@]}" ../rendered/files/ui_manifest.json; do
              cp "$shot" "$dest/"
            done
            git add "$dest"
            export GIT_AUTHOR_NAME='github-actions[bot]'
            export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            msg="Web UI evidence for PR #${PR} at ${HEAD_SHA}"
            if git diff --cached --quiet; then
              echo "already pushed for this head SHA"
            else
              git commit -q -m "$msg"
            fi
            require_fresh_head
            if ! git push origin pr-evidence; then
              # Someone else pushed first. Re-base by moving onto the new tip
              # and re-adding only our directory (a rebase can't work across
              # shallow fetches). Other PRs' files come from the new tip.
              git fetch --depth 1 origin pr-evidence
              git reset -q FETCH_HEAD
              git add "$dest"
              git diff --cached --quiet || git commit -q -m "$msg"
              require_fresh_head
              git push origin pr-evidence
            fi
            EVIDENCE_SHA="$(git rev-parse HEAD)"
            echo "evidence push: $EVIDENCE_SHA"
          fi
          echo "evidence_sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"

  comment:
    # The only job that can comment. Pins the placeholder to the push SHA,
    # re-checks the marker and size, and edits only the bot's own comment.
    # It posts on every outcome — the rendered comment, the fixed refusal
    # notice, or the fixed publish_failed notice — never silence. The
    # decision of what to post lives in main's Python (decide-comment, see
    # scripts/publish_evidence.py); the shell only carries out its word.
    needs: [resolve, build, push]
    # Build failed means render refused (or crashed before uploading, so the
    # download below finds nothing); push failed means the images may not
    # be on the branch. Both still post their fixed notice. A stale head is
    # the only silent stop, checked in-step below.
    if: >-
      always() &&
      needs.resolve.outputs.found == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'failure') &&
      (needs.push.result == 'success' || needs.push.result == 'failure' ||
        needs.push.result == 'skipped')
    name: comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialise the comment-writing jobs per PR (review round 2,
    # finding 2): the group key comes from resolve's outputs (PR digits
    # validated from the API, never from the artifact), and a queued run
    # waits instead of displacing the one writing now, so the comment
    # lookup below sees every earlier write. No workflow-level group
    # exists: GitHub keeps one pending run per group and a newer arrival
    # would displace the current head's pending publisher by queue order,
    # not commit freshness. Residual: a pending comment job can still be
    # displaced by a later arrival for the same PR; if the displacing run
    # is stale it writes nothing and the PR keeps the previous comment,
    # which states its head SHA — re-running the publisher fixes it.
    concurrency:
      group: evidence-comment-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-evidence
          path: rendered
        # A build that died before uploading leaves nothing to download;
        # stay alive so the publish_failed notice below can still post.
        continue-on-error: true
      - name: Post or update the evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          EVIDENCE_SHA: ${{ needs.push.outputs.evidence_sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUSH_RESULT: ${{ needs.push.result }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "bad PR number: $PR"; exit 1;; esac
          case "$RUN_ID" in ''|*[!0-9]*) echo "bad run id: $RUN_ID"; exit 1;; esac
          case "$RUN_ATTEMPT" in ''|*[!0-9]*) echo "bad run attempt: $RUN_ATTEMPT"; exit 1;; esac
          # A build that died before uploading leaves no rendered/
          # directory (the download above then finds nothing): create it
          # so the publish_failed notice below can still be written and
          # posted instead of failing this step with no comment.
          mkdir -p rendered
          flags=""
          if [ -f rendered/refusal.json ]; then flags="$flags --has-refusal"; fi
          if [ -f rendered/comment.md ]; then flags="$flags --has-comment"; fi
          # $flags holds only fixed flag words built above; the printed
          # action is one fixed word from main's code, never PR content.
          # shellcheck disable=SC2086
          action=$(python3 scripts/publish_evidence.py decide-comment \
            --build-result "$BUILD_RESULT" --push-result "$PUSH_RESULT" $flags)
          outcome=""
          case "$action" in
            nothing)
              echo "nothing to post"
              exit 0
              ;;
            refusal-notice)
              # Refused: the notice is main's fixed text plus the validated
              # reason code (read from the file in Python, never from the
              # shell), so no PR content can reach the comment through it.
              # The marker below is stamped from trusted event data only.
              outcome="notice"
              python3 scripts/publish_evidence.py refusal \
                --reason-file rendered/refusal.json \
                --head-sha "$HEAD_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
                > rendered/comment.md
              ;;
            publish-failed)
              # The push failed, or the rendered artifact is missing or
              # corrupt: post the fixed notice built only from main's text.
              outcome="notice"
              printf '{"reason": "publish_failed"}\n' > rendered/refusal.json
              python3 scripts/publish_evidence.py refusal \
                --reason-file rendered/refusal.json \
                --head-sha "$HEAD_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
                > rendered/comment.md
              ;;
            comment)
              outcome="evidence"
              python3 scripts/publish_evidence.py substitute \
                --comment rendered/comment.md --sha "$EVIDENCE_SHA"
              ;;
            *)
              echo "unknown comment action: $action"
              exit 1
              ;;
          esac
          marker='<!-- housesitter-evidence'
          if [ "$(head -c ${#marker} rendered/comment.md)" != "$marker" ]; then
            echo "comment does not start with the marker; not posting"; exit 1
          fi
          if [ "$(wc -c < rendered/comment.md)" -gt 65000 ]; then
            echo "comment is too large; not posting"; exit 1
          fi
          # Freshness re-check, immediately before posting and after all
          # preparation above: the PR may have moved while this step ran.
          # Stopping without writing beats posting for a superseded commit;
          # the newer run publishes.
          fresh_rc=0
          python3 scripts/publish_evidence.py check-head \
            --repo "$REPO" --pr "$PR" --expected "$HEAD_SHA" || fresh_rc=$?
          if [ "$fresh_rc" = 1 ]; then exit 0; fi
          if [ "$fresh_rc" != 0 ]; then exit "$fresh_rc"; fi
          # The job is serialised per PR (concurrency above), so this lookup
          # sees every earlier write. Main's Python applies the monotonic
          # rules — never write over a same-head comment from a newer run,
          # and a notice never replaces same-head evidence — and prints one
          # plan; the shell below only carries out its fixed words and its
          # digit-only ids (each re-validated before use).
          plan=$(python3 scripts/publish_evidence.py decide-write \
            --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --outcome "$outcome")
          first=$(printf '%s\n' "$plan" | sed -n '1p')
          second=$(printf '%s\n' "$plan" | sed -n '2p')
          id=""
          case "$first" in
            SKIP)
              echo "keeping the existing comment"
              exit 0
              ;;
            POST)
              ;;
            PATCH\ *)
              id=${first#PATCH }
              case "$id" in ''|*[!0-9]*) echo "bad comment id: $id"; exit 1;; esac
              ;;
            *)
              echo "unknown write plan: $first"
              exit 1
              ;;
          esac
          drops=""
          case "$second" in
            '')
              ;;
            DELETE|DELETE\ *)
              drops=${second#DELETE}
              ;;
            *)
              echo "unknown write plan line: $second"
              exit 1
              ;;
          esac
          case "$first" in
            POST)
              gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@rendered/comment.md > /dev/null
              echo "Posted a new comment"
              ;;
            PATCH*)
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@rendered/comment.md > /dev/null
              echo "Updated comment $id"
              ;;
          esac
          for drop in $drops; do
            case "$drop" in ''|*[!0-9]*) echo "bad comment id: $drop"; exit 1;; esac
            gh api -X DELETE "repos/$REPO/issues/comments/$drop" > /dev/null
            echo "Deleted comment $drop"
          done
