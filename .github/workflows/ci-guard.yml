# Testing-mechanism guard (docs/DECISIONS.md D16). `ci-guard` is one of the
# two checks the `main` ruleset requires.
#
# Runs on `pull_request_target`, which always uses this file from the target
# branch — never PR code. It checks out the *base* commit only (never the PR
# ref) and runs the base's scripts (stdlib only) against the PR:
# - `scripts/ci_guard.py` lists the PR's changed files through the API and
#   fails when the PR touches a protected path, unless the PR comes from this
#   repo's own branches AND its author has admin, maintain, or write
#   permission. The token is used for read-only API calls. File names travel
#   through the API into Python, which escapes them before printing.
# - `scripts/hygiene_scan.py` then scans the PR head tree's blobs over git
#   plumbing. The head commit is fetched as objects only
#   (`refs/pull/<N>/head`, verified byte-for-byte against the event's head
#   SHA) and its blobs are read through `git ls-tree`/`git cat-file`, never
#   checked out and never imported or executed. PR content enters the base
#   interpreter only as scanned data: both SHAs travel via `env:`, never
#   interpolated into the script, and `python -I` ignores environment-driven
#   interpreter configuration. A huge or unreadable tree fails closed.
# No PR content ever reaches a shell command line, an `eval`, or a file name
# used as code here.
#
# Every third-party step is GitHub's own, pinned to a full commit SHA.
name: ci-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci-guard:
    name: ci-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit, not the PR: PR code must never execute here.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Check for protected-path changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python scripts/ci_guard.py --repo "$REPO" --pr "$PR"
      - name: Trusted hygiene scan of the PR head tree
        # Hard bound: GitHub kills a stalled scan and the required check
        # fails. The in-process SCAN_DEADLINE_S is the inner deadline; this
        # stays below the job's own timeout.
        timeout-minutes: 6
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -I scripts/hygiene_scan.py --fetch-and-scan-pr-head
